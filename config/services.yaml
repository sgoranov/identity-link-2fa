# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    fallback_app_secret: '%env(APP_SECRET)%'
    fallback_db_user: '%env(DB_USER)%'
    fallback_db_password: '%env(DB_PASSWORD)%'
    issuer: '%env(TWO_FA_ISSUER)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Makes sgoranov\IdentityLinkShared services available
    sgoranov\IdentityLinkShared\:
        resource: '../vendor/sgoranov/identity-link-shared/src/*'

    sgoranov\IdentityLinkShared\Security\AccessTokenHandlerConfiguration:
        arguments:
            $issuer: '%env(JWT_URL)%'
            $audiences: ['%env(JWT_URL)%']
            $jwksUri: '%env(JWT_JWKS_URI)%'

    sgoranov\IdentityLinkShared\EventListener\XForwardedPrefixListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 10 }

    sgoranov\IdentityLinkShared\EventListener\LocaleListener:
      tags:
        - { name: kernel.event_listener, event: kernel.request, priority: 15 }

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    app.security.scope_voter:
        class: Symfony\Component\Security\Core\Authorization\Voter\RoleVoter
        arguments: ['2fa.']
        tags: ['security.voter']

    # Adds the X-Request-Id header to every log record as extra.request_id
    sgoranov\IdentityLinkShared\Monolog\RequestIdProcessor: ~
