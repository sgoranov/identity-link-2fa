# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    fallback_app_secret: '%env(APP_SECRET)%'
    fallback_db_user: '%env(DB_USER)%'
    fallback_db_password: '%env(DB_PASSWORD)%'
    issuer: '%env(TWO_FA_ISSUER)%'
    redirect_uri: '%env(TWO_FA_REDIRECT_URI)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Makes sgoranov\IdentityLinkShared services available
    sgoranov\IdentityLinkShared\:
        resource: '../vendor/sgoranov/identity-link-shared/src/*'

    sgoranov\IdentityLinkShared\Security\AccessTokenHandler:
        calls:
            - method: setUri
              arguments:
                  - '%env(JWT_JWKS_URI)%'

    sgoranov\IdentityLinkShared\EventListener\XForwardedPrefixListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 10 }

    sgoranov\IdentityLinkShared\EventListener\LocaleListener:
      tags:
        - { name: kernel.event_listener, event: kernel.request, priority: 15 }

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    sgoranov\IdentityLinkShared\EventListener\RequestResponseLogger:
        arguments:
            $logger: '@monolog.logger.rest'